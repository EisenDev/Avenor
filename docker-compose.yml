services:
  app:
    image: ghcr.io/eisendev/avenor:latest
    container_name: avenor-app
    restart: always
    ports:
      - "80:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secret-auth-key-change-in-prod}
      AUTH_SECRET: ${AUTH_SECRET:-super-secret-auth-key-change-in-prod}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - uploads_data:/app/public/uploads

volumes:
  uploads_data:
